[project]
name = "legal-span-eval"
version = "0.1.0"
description = "Reproducible evaluation of frontier LLMs on legal clause extraction, with a focus on what overlap metrics miss."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3==1.43.36",
    "botocore==1.43.36",
    "httpx==0.28.1",
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
