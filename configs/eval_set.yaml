# Frozen evaluation set. These values describe how data/eval_set/eval_set.jsonl
# was built; the file itself is redistributed as-is and is never rebuilt here.

source:
  dataset: CUAD v1
  publisher: The Atticus Project
  url: https://huggingface.co/datasets/theatticusproject/cuad
  file: CUAD_v1/CUAD_v1.json
  license: CC BY 4.0
  paper: "arXiv:2103.06268"

# Construction parameters of the original builder (copied verbatim from its constants).
construction:
  n_categories: 6
  n_per_category: 25
  n_present_per_category: 12   # n_per_category // 2
  n_absent_per_category: 13
  category_selection: >-
    alphabetical: the first 6 categories (sorted by name) with at least 13 present
    and 13 absent items
  sampling: random.Random(seed).sample, without replacement, per category and label
  seed: 42
  max_excerpt_chars: 8000
  excerpt_rule: >-
    absent items use the first 8000 characters of the contract; present items use an
    8000-character window centered on the gold spans, uncapped when the gold spans
    themselves span 8000 or more characters

